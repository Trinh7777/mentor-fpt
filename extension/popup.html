<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>UniFs FAP Sync</title>
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      color: #333;
    }
    h3 {
      margin: 0 0 8px 0;
      color: #f26f21;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 16px;
    }
    p {
      font-size: 13px;
      line-height: 1.4;
      color: #555;
      margin: 0 0 12px 0;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #e6f4ea;
      color: #137333;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .tip {
      background: #f8f9fa;
      border-left: 3px solid #f26f21;
      padding: 8px 10px;
      font-size: 12px;
      color: #666;
      border-radius: 0 4px 4px 0;
    }
  </style>
</head>
<body>
  <h3>🎓 UniFs FAP Sync</h3>
  <span class="badge">Đã kết nối</span>
  <p>Extension đang hoạt động trên hệ thống FAP Đại học FPT.</p>
  <div class="tip">
    👉 Hãy vào trang <b>Bảng điểm (Mark Report / Academic Transcript)</b> hoặc <b>Lịch học</b> trên FAP, rồi bấm nút màu cam ở góc dưới bên phải màn hình để đồng bộ.
  </div>
</body>
</html>
